services:
  backend:
    build:
      context: ./backend
    container_name: archi-local-chatbot-backend
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: archi-local-chatbot-frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped
