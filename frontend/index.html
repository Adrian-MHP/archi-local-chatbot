<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Archi Local Chatbot</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="layout">
      <section class="panel left">
        <h1>Archi Local Chatbot</h1>
        <p>Frontend + backend connected to your local Archi MCP server and Azure model.</p>

        <div class="health" id="healthBox">
          <strong>Service Status</strong>
          <pre id="healthText">Loading...</pre>
        </div>

        <button id="clearBtn" class="secondary">Clear Conversation</button>
      </section>

      <section class="panel right">
        <div id="chatWindow" class="chat-window"></div>

        <form id="chatForm" class="composer">
          <textarea id="messageInput" rows="3" placeholder="Ask about your Archi model..." required></textarea>
          <div class="composer-row">
            <button id="sendBtn" type="submit">Send</button>
          </div>
        </form>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
