server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Some LLM-backed endpoints (mapping & gap analysis, Soll proposals) genuinely take
        # well over nginx's 60s default, especially over large process lists.
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        # nginx's default client_max_body_size is 1MB -- fine for a single small upload, but the
        # As-Is/To-Be steps now accept MULTIPLE files per request (backend's own MAX_UPLOAD_BYTES
        # is an 8MB-per-file check on top of this), so the combined body needs real headroom or
        # nginx itself rejects the request with a 413 before the backend ever sees it.
        client_max_body_size 100M;
    }

    location / {
        # Never let the browser silently serve a stale app.js/index.html from disk cache after a
        # rebuild -- this app changes fast enough during development that a background reload of
        # this SPA shell needs to always hit the network and revalidate.
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri /index.html;
    }
}
