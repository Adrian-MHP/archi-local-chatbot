server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Some LLM-backed endpoints (mapping & gap analysis, Soll proposals) genuinely take
        # well over nginx's 60s default, especially over large process lists.
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location / {
        # Never let the browser silently serve a stale app.js/index.html from disk cache after a
        # rebuild -- this app changes fast enough during development that a background reload of
        # this SPA shell needs to always hit the network and revalidate.
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri /index.html;
    }
}
